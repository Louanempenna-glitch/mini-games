<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Classement</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    input, button {
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin: 5px;
      font-size: 16px;
    }

    button {
      background: #00c853;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    table {
      width: 90%;
      margin: 30px auto;
      border-collapse: collapse;
      background: #222;
      border-radius: 15px;
      overflow: hidden;
    }

    th, td {
      padding: 15px;
      border-bottom: 1px solid #444;
    }

    th {
      background: #00c853;
      color: white;
    }

    tr:hover {
      background: #333;
    }

    a {
      color: white;
      display: inline-block;
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>

<body>

<h1>🏆 Classement des joueurs</h1>

<input id="playerName" placeholder="Nom du joueur">
<button onclick="savePlayer()">Enregistrer mon profil</button>

<table>
  <thead>
    <tr>
      <th>Rang</th>
      <th>Joueur</th>
      <th>Temps joué</th>
      <th>Catch Coin</th>
      <th>Dodge Car</th>
      <th>Whack a Mole</th>
      <th>Toilet Rush</th>
      <th>Score global</th>
    </tr>
  </thead>
  <tbody id="ranking"></tbody>
</table>

<a href="index.html">⬅ Retour au menu</a>

<script>
function savePlayer() {
  const name = document.getElementById("playerName").value.trim();

  if (name === "") {
    alert("Entre ton nom !");
    return;
  }

  localStorage.setItem("currentPlayer", name);

  let players = JSON.parse(localStorage.getItem("players")) || {};

  if (!players[name]) {
    players[name] = {
      timePlayed: 0,
      catchScore: 0,
      dodgeScore: 0,
      moleScore: 0,
      toiletLevel: 1
    };
  }

  localStorage.setItem("players", JSON.stringify(players));
  displayRanking();
}

function formatTime(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return min + "m " + sec + "s";
}

function displayRanking() {
  const ranking = document.getElementById("ranking");
  ranking.innerHTML = "";

  let players = JSON.parse(localStorage.getItem("players")) || {};

  let playerArray = Object.keys(players).map(function(name) {
    let p = players[name];

    let globalScore =
      p.catchScore +
      p.dodgeScore +
      p.moleScore +
      p.toiletLevel * 10 +
      Math.floor(p.timePlayed / 10);

    return {
      name: name,
      timePlayed: p.timePlayed || 0,
      catchScore: p.catchScore || 0,
      dodgeScore: p.dodgeScore || 0,
      moleScore: p.moleScore || 0,
      toiletLevel: p.toiletLevel || 1,
      globalScore: globalScore
    };
  });

  playerArray.sort(function(a, b) {
    return b.globalScore - a.globalScore;
  });

  playerArray.forEach(function(player, index) {
    ranking.innerHTML += `
      <tr>
        <td>${index + 1}</td>
        <td>${player.name}</td>
        <td>${formatTime(player.timePlayed)}</td>
        <td>${player.catchScore}</td>
        <td>${player.dodgeScore}</td>
        <td>${player.moleScore}</td>
        <td>Niveau ${player.toiletLevel}</td>
        <td>${player.globalScore}</td>
      </tr>
    `;
  });
}

displayRanking();
</script>

</body>
</html>
